                    <th key={z.id} onClick={() => setActiveZone(activeZone === z.id ? null : z.id)}
                      style={{
                        padding: "8px 6px", fontSize: "10px", letterSpacing: "0.5px",
                        color: activeZone === z.id ? "#F4F1EB" : "#555",
                        fontWeight: activeZone === z.id ? "700" : "400",
                        borderBottom: "1px solid #2a2a2a", cursor: "pointer", textAlign: "center",
                        background: activeZone === z.id ? "#2a2a2a" : "transparent",
                        transition: "all 0.15s",
                      }}>
                      {z.short}
                    </th>
                  ))}
                  <th style={{ padding: "8px 6px", fontSize: "10px", color: "#555", fontWeight: "400", borderBottom: "1px solid #2a2a2a", textAlign: "center" }}>
                    Total
                  </th>
                </tr>
              </thead>
              <tbody>
                {VENDORS.sort((a, b) => {
                  const sa = Object.values(a.zones).reduce((s, z) => s + z.score, 0);
                  const sb = Object.values(b.zones).reduce((s, z) => s + z.score, 0);
                  return sb - sa;
                }).map(v => {
                  const total = Object.values(v.zones).reduce((s, z) => s + z.score, 0);
                  const isFocus = focusId === v.id;
                  return (
                    <tr key={v.id} onClick={() => setSelected(selected === v.id ? null : v.id)}
                      onMouseEnter={() => !selected && setHovered(v.id)}
                      onMouseLeave={() => setHovered(null)}
                      style={{ cursor: "pointer", opacity: focusId && !isFocus ? 0.25 : 1, transition: "opacity 0.15s" }}>
                      <td style={{ padding: "8px 12px", borderBottom: "1px solid #222" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                          <div style={{ width: "11px", height: "11px", borderRadius: "50%", background: v.color, flexShrink: 0 }} />
                          <div>
                            <div style={{ fontSize: "12px", color: "#ddd", fontWeight: "700", lineHeight: "1.2" }}>{v.name}</div>
                            <div style={{ fontSize: "9px", color: "#555", marginTop: "1px" }}>{TIER_META[v.tier].label}</div>
                          </div>
                        </div>
                      </td>
                      {ZONE_META.map(z => {
                        const zd = v.zones[z.id];
                        const highlight = activeZone === z.id;
                        return (
                          <td key={z.id} style={{ padding: "8px 6px", textAlign: "center", borderBottom: "1px solid #222", background: highlight ? "#222" : "transparent" }}>
                            <div style={{
                              width: "36px", height: "36px", borderRadius: "6px", margin: "0 auto",
                              background: scoreColor(zd.score, v.color),
                              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                              border: highlight ? `1px solid ${v.color}50` : "1px solid transparent",
                            }}>
                              <div style={{ fontSize: "14px", fontWeight: "900", color: zd.score >= 3 ? "#fff" : "#666", lineHeight: 1 }}>{zd.score}</div>
                              <div style={{ fontSize: "7px", color: SRC_COLORS[zd.src.split("/")[0]] || "#888", letterSpacing: "0.5px", marginTop: "1px" }}>
                                {zd.src.split("/")[0]}
                              </div>
                            </div>
                          </td>
                        );
                      })}
                      <td style={{ padding: "8px 6px", textAlign: "center", borderBottom: "1px solid #222" }}>
                        <div style={{
                          fontSize: "16px", fontWeight: "900",
                          color: total >= 22 ? "#4ade80" : total >= 18 ? "#facc15" : "#f97316",
                        }}>{total}</div>
                        <div style={{ fontSize: "8px", color: "#444" }}>/25</div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{ display: "flex", gap: "16px", marginTop: "12px", flexWrap: "wrap" }}>
              <div style={{ fontSize: "10px", color: "#444" }}>
                <span style={{ color: "#4ade80", fontWeight: "700" }}>22–25</span> = Full-stack leader &nbsp;
                <span style={{ color: "#facc15", fontWeight: "700" }}>18–21</span> = Challenger &nbsp;
                <span style={{ color: "#f97316", fontWeight: "700" }}>&lt;18</span> = Specialist
              </div>
            </div>
          </div>
        )}

        {/* G2 TAB */}
        {tab === "g2" && (
          <div style={{ background: "#fff", borderRadius: "14px", padding: "20px" }}>
            <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: "#aaa", marginBottom: "16px" }}>
              G2 Verified User Ratings — 2026 Data
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: "12px" }}>
              {[
                { name: "UiPath Agentic Automation", rating: 4.6, reviews: 5816, color: "#FA4616", note: "Highest-rated by volume. Most validated user base." },
                { name: "Salesforce Agentforce", rating: 4.4, reviews: 846, color: "#00A1E0", note: "G2 #1 Agentic AI platform 2026. 83% meet-requirements." },
                { name: "Microsoft Copilot Studio", rating: 4.4, reviews: 140, color: "#0078D4", note: "Leader in AI Agent Builders. Fewer reviews vs SF." },
                { name: "ServiceNow AI Agents", rating: 4.4, reviews: null, color: "#62D84E", note: "Enterprise Leader. Review count not publicly disclosed." },
                { name: "Google Vertex AI", rating: 4.3, reviews: 633, color: "#EA4335", note: "Strong on model capability. ADK: 8M+ downloads." },
                { name: "IBM watsonx Orchestrate", rating: 4.3, reviews: null, color: "#1F70C1", note: "Praised for governance. Steep learning curve noted." },
              ].map((item, i) => (
                <div key={i} style={{ background: "#f9f7f3", borderRadius: "10px", padding: "14px", borderLeft: `4px solid ${item.color}` }}>
                  <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px" }}>
                    <div style={{ width: "10px", height: "10px", borderRadius: "50%", background: item.color }} />
                    <span style={{ fontSize: "12px", fontWeight: "700", color: "#111" }}>{item.name}</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: "6px", marginBottom: "4px" }}>
                    <span style={{ fontSize: "28px", fontWeight: "900", color: item.color, lineHeight: 1 }}>{item.rating}</span>
                    <span style={{ fontSize: "11px", color: "#999" }}>/ 5.0</span>
                    {item.reviews && <span style={{ fontSize: "11px", color: "#bbb", marginLeft: "4px" }}>({item.reviews.toLocaleString()} reviews)</span>}
                  </div>
                  <div style={{ display: "flex", gap: "2px", marginBottom: "6px" }}>
                    {[1,2,3,4,5].map(i => (
                      <div key={i} style={{ width: "20px", height: "4px", borderRadius: "2px", background: i <= Math.round(item.rating) ? item.color : "#e5e5e5" }} />
                    ))}
                  </div>
                  <div style={{ fontSize: "11px", color: "#666", lineHeight: "1.4" }}>{item.note}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: "16px", padding: "12px", background: "#f9f7f3", borderRadius: "10px" }}>
              <div style={{ fontSize: "10px", color: "#aaa", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "6px" }}>Note on G2 data</div>
              <div style={{ fontSize: "11px", color: "#888", lineHeight: "1.5" }}>
                SAP Joule, Oracle Fusion AI, and Workday Illuminate do not have sufficient standalone G2 reviews in the AI Agent Builders category as of April 2026. Their ISG and Gartner analyst coverage is used instead.
                Source: G2.com verified reviews, February–April 2026.
              </div>
            </div>
          </div>
        )}

        {/* BADGES TAB */}
        {tab === "badges" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: "12px" }}>
            {VENDORS.map(v => (
              <div key={v.id} style={{ background: "#fff", borderRadius: "12px", padding: "16px", borderTop: `4px solid ${v.color}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px" }}>
                  <div style={{ width: "12px", height: "12px", borderRadius: "50%", background: v.color }} />
                  <div>
                    <div style={{ fontSize: "13px", fontWeight: "700", color: "#111" }}>{v.name}</div>
                    <div style={{ fontSize: "10px", color: "#aaa" }}>{v.tagline}</div>
                  </div>
                </div>
                {v.analystBadges.map((b, i) => (
                  <div key={i} style={{
                    fontSize: "11px", padding: "4px 8px", borderRadius: "6px",
                    background: "#f4f1eb", color: "#333", marginBottom: "4px",
                    borderLeft: `3px solid ${v.color}`,
                  }}>
                    {b}
                  </div>
                ))}
                <div style={{ marginTop: "8px", fontSize: "10px", color: "#bbb", lineHeight: "1.4" }}>{v.sources}</div>
              </div>
            ))}
          </div>
        )}

        {/* Detail Panel */}
        {focusVendor && tab === "heatmap" && (
          <div style={{ background: "#fff", borderRadius: "14px", padding: "22px", borderLeft: `5px solid ${focusVendor.color}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: "10px", marginBottom: "16px" }}>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: "#bbb", marginBottom: "4px" }}>
                  {TIER_META[focusVendor.tier].label}
                </div>
                <h2 style={{ margin: 0, fontSize: "20px", fontWeight: "900" }}>{focusVendor.name}</h2>
                <div style={{ fontSize: "12px", color: "#999", marginTop: "3px" }}>{focusVendor.tagline}</div>
                {focusVendor.g2.rating && (
                  <div style={{ marginTop: "6px", display: "flex", alignItems: "center", gap: "6px" }}>
                    <span style={{ fontSize: "13px", fontWeight: "900", color: "#FF492C" }}>G2 {focusVendor.g2.rating}★</span>
                    {focusVendor.g2.reviews && <span style={{ fontSize: "11px", color: "#bbb" }}>({focusVendor.g2.reviews.toLocaleString()} reviews)</span>}
                    <span style={{ fontSize: "10px", color: "#bbb" }}>· {focusVendor.g2.badge}</span>
                  </div>
                )}
              </div>
              <button onClick={() => setSelected(null)} style={{
                background: "#f4f1eb", border: "none", borderRadius: "6px",
                padding: "6px 14px", cursor: "pointer", fontSize: "12px", color: "#888", fontFamily: "inherit",
              }}>✕</button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "3fr 2fr", gap: "20px" }}>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "2px", textTransform: "uppercase", color: "#bbb", marginBottom: "10px" }}>Layer-by-Layer (with source)</div>
                {ZONE_META.map(z => {
                  const zd = focusVendor.zones[z.id];
                  const srcKey = zd.src.split("/")[0];
                  return (
                    <div key={z.id} style={{ marginBottom: "12px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "3px" }}>
                        <span style={{ fontSize: "11px", fontWeight: "700" }}>{z.label}</span>
                        <div style={{ display: "flex", gap: "4px", alignItems: "center" }}>
                          <span style={{ fontSize: "9px", padding: "1px 5px", borderRadius: "10px", background: (SRC_COLORS[srcKey] || "#888") + "20", color: SRC_COLORS[srcKey] || "#888", fontWeight: "700" }}>{zd.src}</span>
                          <span style={{ fontSize: "12px", fontWeight: "900", color: focusVendor.color }}>{zd.score}/5</span>
                        </div>
                      </div>
                      <div style={{ height: "3px", background: "#f0ece4", borderRadius: "2px", marginBottom: "4px" }}>
                        <div style={{ height: "3px", borderRadius: "2px", width: `${zd.score * 20}%`, background: focusVendor.color, transition: "width 0.4s ease" }} />
                      </div>
                      <div style={{ fontSize: "11px", color: "#666", lineHeight: "1.4" }}>{zd.notes}</div>
                    </div>
                  );
                })}
              </div>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "2px", textTransform: "uppercase", color: "#bbb", marginBottom: "8px" }}>Strengths</div>
                {focusVendor.strengths.map((s, i) => (
                  <div key={i} style={{ fontSize: "11px", color: "#333", marginBottom: "5px", display: "flex", gap: "6px" }}>
                    <span style={{ color: focusVendor.color, fontWeight: "900", flexShrink: 0 }}>+</span>{s}
                  </div>
                ))}
                <div style={{ fontSize: "10px", letterSpacing: "2px", textTransform: "uppercase", color: "#bbb", marginBottom: "8px", marginTop: "14px" }}>Weaknesses</div>
                {focusVendor.weaknesses.map((w, i) => (
                  <div key={i} style={{ fontSize: "11px", color: "#333", marginBottom: "5px", display: "flex", gap: "6px" }}>
                    <span style={{ color: "#c0392b", fontWeight: "900", flexShrink: 0 }}>−</span>{w}
                  </div>
                ))}
                <div style={{ marginTop: "14px", padding: "10px", background: "#f4f1eb", borderRadius: "8px" }}>
                  <div style={{ fontSize: "9px", color: "#bbb", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "4px" }}>Analyst Sources</div>
                  <div style={{ fontSize: "10px", color: "#888", lineHeight: "1.5" }}>{focusVendor.sources}</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Analyst snapshot bar */}
        <div style={{ background: "#1a1a1a", borderRadius: "12px", padding: "18px" }}>
          <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: "#555", marginBottom: "12px" }}>
            Key Analyst Findings — April 2026
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: "14px" }}>
            {[
              { src: "ISG", color: SRC_COLORS.ISG, finding: "Oracle ranks #1 overall in ISG AI Agents Buyers Guide 2025 — most of any vendor (7 categories). ServiceNow #2 (6 categories)." },
              { src: "GCC", color: SRC_COLORS.GCC, finding: "Gartner Critical Capabilities 2025: ServiceNow ranked #1 for Building and Managing AI Agents." },
              { src: "GMQ", color: SRC_COLORS.GMQ, finding: "Gartner AIDP MQ Nov 2025: Microsoft furthest in Completeness of Vision. Google highest in Ability to Execute." },
              { src: "G2",  color: SRC_COLORS.G2,  finding: "G2 2026: UiPath is highest-rated by volume (4.6★/5,816 reviews). Salesforce is G2 #1 Agentic AI platform." },
              { src: "FUT", color: SRC_COLORS.FUT,  finding: "Futurum 2025: Every major vendor claims 'agentic OS' positioning. At most one wins per enterprise." },
              { src: "CMP", color: SRC_COLORS.CMP, finding: "Analyst comparisons: Agentforce + ServiceNow dominate enterprise deployments. IBM leads for regulated industries requiring auditability." },
            ].map((item, i) => (
              <div key={i}>
                <span style={{ fontSize: "9px", padding: "2px 6px", borderRadius: "10px", background: item.color + "25", color: item.color, fontWeight: "700", letterSpacing: "1px" }}>{item.src}</span>
                <div style={{ fontSize: "11px", color: "#777", lineHeight: "1.5", marginTop: "5px" }}>{item.finding}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ fontSize: "10px", color: "#bbb", textAlign: "center", paddingBottom: "4px" }}>
          Sources: G2.com (2026) · Gartner Magic Quadrant for AI Application Development Platforms (Nov 2025) · Gartner Magic Quadrant for Conversational AI (Aug 2025) · Gartner Critical Capabilities for AI Agents (2025) · ISG AI Agents Software Provider Buyers Guide (2025) · Futurum Research (Q1–Q4 2025) · Analyst comparisons (SmartBridge, DataBusinessCentral, PlanetaryLabour) · April 2026
        </div>
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

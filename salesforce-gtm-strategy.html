                    <div style={{ fontSize: "12px", fontWeight: "700", color: C.bright, marginBottom: "6px" }}>{w.label}</div>
                    <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.6", marginBottom: "8px" }}>{w.detail}</div>
                    <div style={{ fontSize: "9px", color: C.faint, borderTop: `1px solid ${C.border}`, paddingTop: "8px" }}>{w.src}</div>

              <div style={{ fontSize: "14px", color: C.text, lineHeight: "1.8", fontStyle: "italic" }}>
                "Only 8% of Salesforce's global customer base has adopted Agentforce — which means 92% of the installed base is an expansion opportunity. The GTM motion for UK high-tech is therefore as much a retention and expansion play as it is a new logo play. The accounts that haven't yet seen Agentforce value are the ones most at risk of competitive displacement — and the most receptive to the right conversation."

        {/* SELL FIRST */}

            <SH title="What to Sell First — and Why" sub="Ranked by strategic sequencing, not deal size. Data Cloud first, always." />

                    <span style={{ color: C.muted, fontSize: "14px" }}>{expandedSell === i ? "▲" : "▼"}</span>
                  </div>
                  {expandedSell === i && (
                    <div style={{ padding: "0 20px 20px", borderTop: `1px solid ${C.border}` }}>
                      <div style={{ paddingTop: "16px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px" }}>
                        <div>

                          <p style={{ fontSize: "12px", color: C.muted, lineHeight: "1.7", margin: "6px 0 0" }}>{s.why}</p>
                          <Label mt>TAM Exposure</Label>
                          <div style={{ fontSize: "12px", color: s.color, fontWeight: "600", marginTop: "4px" }}>{s.tam}</div>

                        <div>

                          <div style={{ fontSize: "12px", color: C.muted, fontStyle: "italic", marginTop: "6px", padding: "10px", background: C.faint + "30", borderRadius: "6px" }}>"{s.objection}"</div>
                          <Label mt>Counter</Label>
                          <div style={{ fontSize: "12px", color: C.text, lineHeight: "1.6", marginTop: "6px" }}>{s.counter}</div>

              ))}
            </div>

            <SH title="Crucial Win Themes" sub="Four themes drawn directly from Salesforce Tech & Telco strategy (Slide 1). Each has a C-suite message and competitive moat." />
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(420px, 1fr))", gap: "16px" }}>
              {WIN_THEMES.map((t, i) => (
                <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: "8px", overflow: "hidden" }}>
                  <div style={{ padding: "16px 20px", background: t.color + "18", borderBottom: `1px solid ${t.color}40` }}>
                    <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                      <span style={{ fontSize: "22px", color: t.color }}>{t.icon}</span>
                      <div>
                        <div style={{ fontSize: "11px", letterSpacing: "2px", textTransform: "uppercase", color: t.color, fontWeight: "700" }}>{t.theme}</div>
                        <div style={{ fontSize: "14px", fontWeight: "700", color: C.bright, marginTop: "2px" }}>{t.headline}</div>
                      </div>
                    </div>
                  </div>
                  <div style={{ padding: "16px 20px" }}>
                    <Label>Salesforce angle</Label>
                    <p style={{ fontSize: "12px", color: C.muted, lineHeight: "1.7", margin: "6px 0 12px" }}>{t.salesforceAngle}</p>
                    <Label>Proof points</Label>
                    <div style={{ margin: "6px 0 12px" }}>
                      {t.proofPoints.map((p, j) => (
                        <div key={j} style={{ fontSize: "11px", color: C.text, marginBottom: "4px", display: "flex", gap: "6px" }}>
                          <span style={{ color: t.color }}>→</span>{p}
                        </div>
                      ))}
                    </div>
                    <Label>Why competitors can't match this</Label>
                    <p style={{ fontSize: "11px", color: C.muted, lineHeight: "1.6", margin: "6px 0 12px", fontStyle: "italic" }}>{t.competitiveMoat}</p>
                    <div style={{ padding: "10px 14px", background: t.color + "15", borderRadius: "6px", borderLeft: `3px solid ${t.color}` }}>
                      <div style={{ fontSize: "9px", letterSpacing: "2px", textTransform: "uppercase", color: t.color, marginBottom: "4px" }}>C-Suite Message</div>
                      <div style={{ fontSize: "11px", color: C.text, lineHeight: "1.6", fontStyle: "italic" }}>{t.cSuiteMessage}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* COMPETITION */}
        {active === "compete" && (
          <div>
            <SH title="Who to Target — Competitive Strategy" sub="Threat level, displacement angle, and win condition per competitor. Match to account-level intelligence." />
            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              {COMPETE.map((c, i) => (
                <div key={i} style={{ background: C.card, border: `1px solid ${expandedCompete === i ? c.threatColor : C.border}`, borderRadius: "8px", overflow: "hidden" }}>

                        <span style={{ fontSize: "9px", padding: "2px 8px", borderRadius: "20px", background: c.threatColor + "25", color: c.threatColor, fontWeight: "700", letterSpacing: "1px" }}>THREAT: {c.threat}</span>
                      </div>
                      <div style={{ fontSize: "11px", color: C.muted, marginTop: "3px" }}>Target persona: {c.targetPersona}</div>
                    </div>
                    <span style={{ color: C.muted, fontSize: "14px" }}>{expandedCompete === i ? "▲" : "▼"}</span>
                  </div>
                  {expandedCompete === i && (
                    <div style={{ padding: "0 20px 20px", borderTop: `1px solid ${C.border}` }}>
                      <div style={{ paddingTop: "16px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px" }}>

                          <p style={{ fontSize: "12px", color: C.muted, lineHeight: "1.7", margin: "6px 0 12px" }}>{c.why}</p>
                          <Label>Swap opportunity</Label>

                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: "10px", marginBottom: "12px" }}>

                    <div style={{ marginTop: "12px", display: "flex", gap: "8px", flexWrap: "wrap" }}>

                    <div style={{ marginTop: "12px", padding: "10px", background: C.faint + "20", borderRadius: "6px" }}>

                      <div style={{ fontSize: "11px", color: C.muted, marginTop: "4px", lineHeight: "1.5" }}>{a.expandPath}</div>

                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: "16px", padding: "16px 20px", background: C.card, border: `1px solid ${C.border}`, borderRadius: "8px" }}>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: "10px" }}>

                  <div key={i} style={{ padding: "10px", background: C.faint + "20", borderRadius: "6px" }}>
                    <div style={{ fontSize: "11px", fontWeight: "700", color: C.bright }}>{a}</div>
                    <div style={{ fontSize: "10px", color: C.muted }}>{b}</div>
                    <div style={{ fontSize: "14px", fontWeight: "700", color: C.sf, marginTop: "2px" }}>{c}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: "12px", fontSize: "13px", color: C.text }}>Indicative range builds from a single new logo + Seed & Grow win to <span style={{ fontWeight: "700", color: C.sf }}>£8M+ ACV</span> at full programme scale, requiring <span style={{ color: C.amber }}>×3 pipeline coverage across all tiers</span></div>
            </div>
          </div>
        )}

        {/* 30-60-90 */}
        {active === "plan" && (
          <div>
            <SH title="30 · 60 · 90 Day Plan" sub="Pipe ×3 + Health + AEP — the execution standard across all tiers" />
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: "16px" }}>
              {PLAN_DAYS.map((phase, i) => (
                <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: "8px", overflow: "hidden", borderTop: `3px solid ${phase.color}` }}>
                  <div style={{ padding: "14px 18px", background: phase.color + "15", borderBottom: `1px solid ${C.border}` }}>
                    <div style={{ fontSize: "9px", letterSpacing: "3px", textTransform: "uppercase", color: phase.color, fontWeight: "700" }}>{phase.period}</div>
                    <div style={{ fontSize: "16px", fontWeight: "700", color: C.bright, marginTop: "2px" }}>{phase.label}</div>
                  </div>
                  <div style={{ padding: "16px 18px" }}>
                    {phase.actions.map((a, j) => (
                      <div key={j} style={{ marginBottom: "14px", paddingBottom: "14px", borderBottom: j < phase.actions.length - 1 ? `1px solid ${C.border}` : "none" }}>
                        <div style={{ fontSize: "12px", fontWeight: "700", color: phase.color, marginBottom: "4px", display: "flex", gap: "8px" }}>
                          <span style={{ color: C.faint }}>{j + 1}.</span>{a.action}
                        </div>
                        <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.6", paddingLeft: "14px" }}>{a.detail}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* TALK TRACK */}
        {active === "talktrack" && (
          <div>
            <SH title="C-Suite Talk Tracks" sub="Persona-specific conversation guides. Open with a challenge, not a pitch. Click to expand each track." />
            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              {TALK_TRACKS.map((t, i) => (
                <div key={i} style={{ background: C.card, border: `1px solid ${expandedTrack === i ? t.color : C.border}`, borderRadius: "8px", overflow: "hidden" }}>
                  <div onClick={() => setExpandedTrack(expandedTrack === i ? null : i)}
                    style={{ padding: "16px 20px", cursor: "pointer", display: "flex", gap: "14px", alignItems: "center" }}>
                    <div style={{ width: "10px", height: "10px", borderRadius: "50%", background: t.color, flexShrink: 0 }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: "14px", fontWeight: "700", color: C.bright }}>{t.persona}</div>
                      <div style={{ fontSize: "11px", color: C.muted, fontStyle: "italic", marginTop: "2px" }}>"{t.opener}"</div>
                    </div>
                    <span style={{ color: C.muted, fontSize: "14px" }}>{expandedTrack === i ? "▲" : "▼"}</span>
                  </div>
                  {expandedTrack === i && (
                    <div style={{ padding: "0 20px 22px", borderTop: `1px solid ${C.border}` }}>
                      <div style={{ paddingTop: "16px", display: "flex", flexDirection: "column", gap: "14px" }}>
                        {[
                          { label: "Open with (challenge)", content: t.challenge, style: "normal" },
                          { label: "Pivot", content: t.pivot, style: "italic" },
                          { label: "Salesforce answer", content: t.sfAnswer, style: "normal" },
                          { label: "Proof point", content: t.proofPoint, style: "normal" },
                          { label: "Closing question", content: t.closingQ, style: "italic" },
                        ].map((step, j) => (
                          <div key={j} style={{ display: "flex", gap: "14px" }}>
                            <div style={{ width: "3px", background: j === 0 ? C.red : j === 1 ? C.amber : j === 3 ? C.green : j === 4 ? t.color : C.muted, borderRadius: "2px", flexShrink: 0, minHeight: "40px" }} />
                            <div>
                              <div style={{ fontSize: "9px", letterSpacing: "2px", textTransform: "uppercase", color: C.muted, marginBottom: "4px" }}>{step.label}</div>
                              <div style={{ fontSize: "12px", color: step.style === "italic" ? C.text : C.muted, lineHeight: "1.7", fontStyle: step.style }}>"{step.content}"</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div style={{ marginTop: "20px", padding: "16px 20px", background: C.card, border: `1px solid ${C.border}`, borderRadius: "8px" }}>
              <div style={{ fontSize: "9px", letterSpacing: "3px", textTransform: "uppercase", color: C.muted, marginBottom: "8px" }}>Universal Rules for Every Executive Conversation</div>
              {["Never open with a product. Open with their problem.", "Every talk track ends with a question that moves the deal forward — not a feature summary.", "Reference a peer in their space, not a case study from a different industry.", "Governance and trust are door-openers in UK tech — especially post-FCA and DORA.", "The NI cost argument is unique to Q2 2025 onwards. Use it now while it is still fresh."].map((r, i) => (
                <div key={i} style={{ fontSize: "12px", color: C.muted, marginBottom: "6px", display: "flex", gap: "8px" }}>
                  <span style={{ color: C.sf, fontWeight: "700", flexShrink: 0 }}>—</span>{r}
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

function SH({ title, sub }) {
  return (
    <div style={{ marginBottom: "22px", paddingBottom: "14px", borderBottom: `1px solid ${C.border}` }}>
      <h2 style={{ margin: 0, fontSize: "20px", fontWeight: "700", color: C.bright, letterSpacing: "-0.3px" }}>{title}</h2>
      {sub && <div style={{ fontSize: "11px", color: C.muted, marginTop: "4px", fontStyle: "italic" }}>{sub}</div>}
    </div>
  );
}

function Label({ children, mt }) {
  return <div style={{ fontSize: "9px", letterSpacing: "2px", textTransform: "uppercase", color: C.muted, fontWeight: "700", marginTop: mt ? "12px" : 0 }}>{children}</div>;
}
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

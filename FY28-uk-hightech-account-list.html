<html lang="en">
<head>
<meta charset="UTF-8"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:#F7F4EE;font-family:Arial,Helvetica,sans-serif;color:#111;-webkit-font-smoothing:antialiased;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#EDE9DF}
::-webkit-scrollbar-thumb{background:#C5BFB4;border-radius:3px}

/* ── MASTHEAD ── */
.masthead{background:#00A1E0;color:#fff;padding:20px 20px 18px}
.masthead-eyebrow{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,0.7);margin-bottom:6px}
.masthead h1{font-size:clamp(18px,4vw,26px);font-weight:700;letter-spacing:-0.5px;margin-bottom:3px}
.masthead-sub{font-size:11px;color:rgba(255,255,255,0.75);margin-bottom:16px}
.masthead-stats{display:flex;flex-wrap:wrap;gap:10px}
.stat-item{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);border-radius:8px;padding:10px 16px;min-width:120px}
.stat-val{font-size:22px;font-weight:700;color:#fff;display:block;line-height:1.1}
.stat-lbl{font-size:10px;color:rgba(255,255,255,0.85);display:block;margin-top:2px}

/* ── CONTROLS ── */
.controls{background:#fff;border-bottom:1px solid #D9D3C8;padding:10px 16px;position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input,.controls select{padding:6px 10px;border:1px solid #D9D3C8;border-radius:6px;font-size:12px;font-family:Arial,Helvetica,sans-serif;background:#EDE9DF;outline:none;color:#111;-webkit-appearance:none}
.controls input{min-width:160px;flex:1}
.btn{padding:6px 12px;border-radius:6px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;cursor:pointer;border:1px solid #D9D3C8;background:#EDE9DF;color:#6B6560}
.btn.active{background:#00A1E0;color:#fff;border-color:#00A1E0}
.btn.signal-btn.active{background:#B8730A20;color:#B8730A;border-color:#B8730A}
.count-lbl{font-size:10px;color:#9B958E;margin-left:auto;white-space:nowrap}

/* ── TIER SUMMARY CARDS ── */
.tier-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:16px 16px 0}
.tier-card{padding:12px 16px;background:#fff;border:2px solid #D9D3C8;border-radius:8px;cursor:pointer;transition:border-color 0.15s}
.tier-card.active{border-color:var(--tc)}
.tier-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.tier-card-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tc);font-weight:700}
.tier-card-count{font-size:22px;font-weight:700;color:var(--tc)}
.tier-card-desc{font-size:10px;color:#6B6560;line-height:1.4}

/* ── MAIN CONTENT ── */
.main{padding:12px 16px 60px}

/* ── CARD GRID ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.account-card{background:#fff;border:1px solid #D9D3C8;border-radius:8px;border-left:4px solid var(--tc);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{font-size:13px;font-weight:700;color:#0D0D0D;line-height:1.2}
.card-meta{font-size:10px;color:#6B6560;margin-top:1px}
.card-rev{text-align:right}
.card-rev-val{font-size:12px;font-weight:700;color:#0D0D0D}
.card-rev-hc{font-size:10px;color:#6B6560}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:0.3px;white-space:nowrap}
.card-notes{font-size:11px;color:#6B6560;line-height:1.5}
.card-products{font-size:10px;color:#9B958E;font-style:italic;line-height:1.4}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid #D9D3C8}
table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}
thead tr{background:#EDE9DF;border-bottom:2px solid #0D0D0D}
th{padding:9px 10px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6B6560;font-weight:700;text-align:left;white-space:nowrap}
tbody tr{border-bottom:1px solid #D9D3C8}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even){background:#FAFAF8}
td{padding:9px 10px;font-size:11px;color:#111;vertical-align:top}
td.name-cell{font-weight:700;white-space:nowrap}
td.notes-cell{color:#6B6560;line-height:1.4;min-width:200px;max-width:280px}
.tier-dot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto}

/* ── SECTION DIVIDER (tier view) ── */
.tier-section{margin-bottom:24px}
.tier-header{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid var(--tc)}
.tier-header-dot{width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tier-header-title{font-size:13px;font-weight:700;color:var(--tc)}
.tier-header-desc{font-size:10px;color:#6B6560}
.tier-header-count{margin-left:auto;font-size:11px;color:#9B958E;white-space:nowrap}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;gap:4px}

/* ── CONSULTANT NOTE ── */
.consultant-box{background:#00A1E0;color:#fff;border-radius:8px;padding:20px 22px;margin-top:24px}
.consultant-eyebrow{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,0.7);margin-bottom:14px}
.consultant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.consultant-item-icon{font-size:18px;margin-bottom:4px}
.consultant-item-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px}
.consultant-item-body{font-size:11px;color:rgba(255,255,255,0.85);line-height:1.6}
.sources{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.3);font-size:9px;color:rgba(255,255,255,0.6);line-height:1.6}

/* ── EMPTY STATE ── */
.empty{padding:40px;text-align:center;color:#9B958E;font-style:italic;font-size:12px}
.hidden{display:none!important}
.new-tag{font-size:8px;padding:1px 5px;border-radius:10px;background:#1A7A4A;color:#fff;font-weight:700;letter-spacing:0.5px;margin-left:4px;vertical-align:middle}
</style>

<!-- MAIN -->
<div class="main" id="main-content"></div>

const NOTES=[
  {icon:'⚡',title:'PE-owned tech = fastest buying motion',body:'Ideagen (Hg), Mimecast (Permira), Civica (Partners Group), Zellis (Apax), IFS (EQT), and SCC (Rigby) are all PE-owned on this list. PE firms drive revenue acceleration and EBITDA expansion — Agentforce\'s cost reduction ROI story lands fastest here. Prioritise these for Q1 outreach.'},
  {icon:'🔀',title:'M&A signals = MuleSoft entry',body:'Access Group, Halma, Endava, Softcat, QinetiQ, and Sophos have all made acquisitions in the last 12 months. Every acquisition creates a data integration problem that hasn\'t been solved yet. MuleSoft is the foot in the door — Data Cloud and Agentforce follow.'},
  {icon:'🤖',title:'Agentic AI vendors are both prospects and competitors',body:'PolyAI, IFS, and Fetch.ai are all building agentic AI capabilities. PolyAI is a natural Agentforce voice integration partner — or a competitive threat in Service Cloud. IFS Digital Workers compete directly with Agentforce for industrial enterprise. Know which story you\'re telling before the first call.'},
  {icon:'🛡️',title:'DORA + defence compliance = forced-buy events',body:'DORA obligations drive non-discretionary buying for all fintech tech vendors. Separately, BAE Systems Digital Intelligence and QinetiQ are both under MOD AI mandates. Shield + Agentforce compliance agents should be positioned before competitors do — especially for NCC Group, Ideagen, Civica, and Zellis.'},
  {icon:'🆕',title:'New additions worth acting on immediately',body:'Clarivate ($4.9B market cap, massive B2B subscription sales team), Endava (fast-growing tech services, NYSE-listed), QinetiQ (£1.5B MOD contract), Civica (PE-backed, 5,000+ public sector clients), and BAE Systems Digital Intelligence (AI-native defence cyber division) are the five highest-priority new additions.'},
  {icon:'👤',title:'Leadership changes = open doors',body:'Kainos, Temenos, Atos UK, Endava, and Stability AI all have leadership transitions in play. New executives reset vendor relationships in the first 100 days — this is the highest-probability window to reposition Salesforce as a strategic partner. Flag these for immediate executive outreach.'},
];

const segs=[...new Set(ACCOUNTS.map(a=>a.seg))].sort();
const segSel=document.getElementById('seg-filter');
segs.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;segSel.appendChild(o);});

let currentView='cards',flagOnly=false,newOnly=false,activeTierFilter=0;

function badge(text,color,bg){return`<span class="badge" style="color:${color};background:${bg||color+'20'}">${text}</span>`;}
function sfBadge(sf){const c=SF_C[sf]||'#6B6560';return`<span class="badge" style="color:${c};background:${c}20">SF: ${sf}</span>`;}
function tierDot(t){return`<div class="tier-dot" style="background:${TC[t]}">${t}</div>`;}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  const seg=document.getElementById('seg-filter').value;
  const tier=parseInt(document.getElementById('tier-filter').value)||0;
  return ACCOUNTS.filter(a=>{
    if(seg&&a.seg!==seg)return false;
    if(tier&&a.tier!==tier)return false;
    if(flagOnly&&a.flags.length===0)return false;
    if(newOnly&&!a.isNew)return false;
    if(q&&!a.name.toLowerCase().includes(q)&&!a.seg.toLowerCase().includes(q)&&!a.hq.toLowerCase().includes(q))return false;
    return true;
  });
}

function renderTierSummary(){
  const tierMeta={
    1:{label:'Tier 1 — Priority',desc:'AI-ready, enterprise buyer, whitespace or partial SF footprint'},
    2:{label:'Tier 2 — Strong Fit',desc:'Strong fit but incumbent CRM or platform complexity'},
    3:{label:'Tier 3 — Watch List',desc:'Longer-term or below headcount threshold — monitor'},
  };
  document.getElementById('tier-summary').innerHTML=[1,2,3].map(t=>{
    const cnt=ACCOUNTS.filter(a=>a.tier===t).length;
    const isActive=activeTierFilter===t;
    return`<div class="tier-card${isActive?' active':''}" style="--tc:${TC[t]}" onclick="clickTier(${t})">
      <div class="tier-card-top"><span class="tier-card-label">${tierMeta[t].label}</span><span class="tier-card-count">${cnt}</span></div>
      <div class="tier-card-desc">${tierMeta[t].desc}</div>
    </div>`;
  }).join('');
}

function clickTier(t){
  const tf=document.getElementById('tier-filter');
  if(activeTierFilter===t){activeTierFilter=0;tf.value='0';}
  else{activeTierFilter=t;tf.value=String(t);}
  render();
}

function cardHTML(a){
  const flags=a.flags.map(f=>badge(f,'#B8730A')).join('');
  const newTag=a.isNew?'<span class="new-tag">NEW</span>':'';
  return`<div class="account-card" style="--tc:${TC[a.tier]}">
    <div class="card-top">
      <div>
        <div class="card-name">${a.name}${newTag}</div>
        <div class="card-meta">${a.hq} · ${a.hc}</div>
      </div>
      <div class="card-rev"><div class="card-rev-val">${a.rev}</div><div class="card-rev-hc">${a.listed.split('(')[0].trim()}</div></div>
    </div>
    <div class="badges">${badge(a.seg,'#6D3A8A')}${sfBadge(a.sf)}${flags}</div>
    <div class="card-notes">${a.notes}</div>
    <div class="card-products">${a.products}</div>
  </div>`;
}

function tableHTML(accounts){
  if(!accounts.length)return'<div class="empty">No accounts match the current filters.</div>';
  const headers=['Company','Segment','HQ','Headcount','Revenue','Listed / Private','SF','Tier','Notes'];
  const rows=accounts.map(a=>{
    const flags=a.flags.map(f=>badge(f,'#B8730A','#B8730A18')).join(' ');
    const newTag=a.isNew?'<span class="new-tag">NEW</span>':'';
    return`<tr>
      <td class="name-cell">${a.name}${newTag}${flags?'<br><div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px">'+flags+'</div>':''}</td>
      <td>${badge(a.seg,'#6D3A8A')}</td>
      <td style="white-space:nowrap">${a.hq}</td>
      <td style="white-space:nowrap;font-weight:600">${a.hc}</td>
      <td style="white-space:nowrap">${a.rev}</td>
      <td style="font-size:10px;color:#6B6560">${a.listed}</td>
      <td>${sfBadge(a.sf)}</td>
      <td>${tierDot(a.tier)}</td>
      <td class="notes-cell">${a.notes}</td>
    </tr>`;
  }).join('');
  return`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function tierHTML(accounts){
  if(!accounts.length)return'<div class="empty">No accounts match the current filters.</div>';
  const tierMeta={
    1:{label:'Tier 1 — Priority',desc:'AI-ready, enterprise buyer, whitespace or partial SF footprint'},
    2:{label:'Tier 2 — Strong Fit',desc:'Strong fit but incumbent CRM or platform complexity'},
    3:{label:'Tier 3 — Watch List',desc:'Longer-term or below headcount threshold — monitor'},
  };
  return[1,2,3].map(t=>{
    const group=accounts.filter(a=>a.tier===t);
    if(!group.length)return'';
    return`<div class="tier-section">
      <div class="tier-header" style="--tc:${TC[t]}">
        <div class="tier-header-dot">${t}</div>
        <div><div class="tier-header-title">${tierMeta[t].label}</div><div class="tier-header-desc">${tierMeta[t].desc}</div></div>
        <span class="tier-header-count">${group.length} accounts</span>
      </div>
      <div class="card-grid">${group.map(cardHTML).join('')}</div>
    </div>`;
  }).join('');
}

function consultantHTML(){
  return`<div class="consultant-box">
    <div class="consultant-eyebrow">Consultant's Note — Non-Obvious Opportunities & Priority Actions</div>
    <div class="consultant-grid">${NOTES.map(n=>`<div>
      <div class="consultant-item-icon">${n.icon}</div>
      <div class="consultant-item-title">${n.title}</div>
      <div class="consultant-item-body">${n.body}</div>
    </div>`).join('')}</div>
    <div class="sources">Sources: Companies House · LinkedIn headcount data · PitchBook · Beauhurst · Crunchbase · Tech Nation UK AI Sector Spotlight 2025 · FTSE listings (LSE) · Mordor Intelligence UK Cybersecurity 2026 · G2 Best Software 2026 · Disfold UK Tech Rankings 2026 · Deloitte Fast 50 2025 · Built In UK 2025 · Individual company reports and press releases (Oct 2025 – May 2026)</div>
  </div>`;
}

function render(){
  activeTierFilter=parseInt(document.getElementById('tier-filter').value)||0;
  const accounts=getFiltered();
  const main=document.getElementById('main-content');
  let html='';
  if(currentView==='cards')html=accounts.length?`<div class="card-grid">${accounts.map(cardHTML).join('')}</div>`:'<div class="empty">No accounts match the current filters.</div>';
  else if(currentView==='table')html=tableHTML(accounts);
  else html=tierHTML(accounts);
  html+=consultantHTML();
  main.innerHTML=html;
  document.getElementById('result-count').textContent=accounts.length+' accounts shown';
  renderTierSummary();
}

function initCounts(){
  document.getElementById('total-count').textContent=ACCOUNTS.length;
  document.getElementById('t1-count').textContent=ACCOUNTS.filter(a=>a.tier===1).length;
  document.getElementById('t2-count').textContent=ACCOUNTS.filter(a=>a.tier===2).length;
  document.getElementById('flag-count').textContent=ACCOUNTS.filter(a=>a.flags.length>0).length;
}

function setView(v){
  currentView=v;
  ['cards','table','tier'].forEach(x=>document.getElementById('btn-'+x).classList.toggle('active',x===v));
  render();
}

function toggleFlag(){
  flagOnly=!flagOnly;
  document.getElementById('flag-btn').classList.toggle('active',flagOnly);
  render();
}

function toggleNew(){
  newOnly=!newOnly;
  document.getElementById('new-btn').classList.toggle('active',newOnly);
  render();
}

initCounts();
render();
</script>
</body>
</html>

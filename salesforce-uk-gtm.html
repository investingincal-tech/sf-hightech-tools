                    <div>
                      <span style={{ fontSize: "9px", padding: "2px 8px", borderRadius: "20px", background: p.tagColor, color: "#fff", letterSpacing: "2px", fontWeight: "700", marginRight: "10px" }}>{p.tag}</span>
                      <span style={{ fontSize: "18px", fontWeight: "700", color: C.ink }}>{p.name}</span>
                      <span style={{ fontSize: "13px", color: C.faint, marginLeft: "8px", fontStyle: "italic" }}>{p.headline}</span>
                    </div>
                  </div>
                  <p style={{ fontSize: "13px", lineHeight: "1.7", color: C.muted, margin: "0 0 12px" }}>{p.pitch}</p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
                    <div>
                      <div style={{ fontSize: "9px", letterSpacing: "2px", textTransform: "uppercase", color: C.faint, marginBottom: "6px" }}>Best For</div>
                      {p.bestFor.map((b, j) => (
                        <div key={j} style={{ fontSize: "11px", color: C.ink, marginBottom: "3px", display: "flex", gap: "6px" }}>
                          <span style={{ color: p.tagColor }}>→</span>{b}
                        </div>
                      ))}
                    </div>
                    <div style={{ padding: "10px", background: C.cream, borderRadius: "4px" }}>
                      <div style={{ fontSize: "9px", letterSpacing: "2px", textTransform: "uppercase", color: C.faint, marginBottom: "6px" }}>Evidence</div>
                      <div style={{ fontSize: "11px", color: C.ink, lineHeight: "1.5" }}>{p.evidence}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── SEGMENTS ── */}
        {activeSection === "segments" && (
          <div>
            <SectionHeader title="Target Segment Deep-Dives" subtitle="Priority targeting rationale by sub-segment" />
            <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
              {SEGMENTS.map((s, i) => (
                <div key={i} style={{ padding: "20px", background: "#fff", border: `1px solid ${C.rule}`, borderRadius: "6px" }}>
                  <div style={{ display: "flex", gap: "12px", alignItems: "center", marginBottom: "10px", flexWrap: "wrap" }}>
                    <span style={{ fontSize: "22px", color: s.color }}>{s.icon}</span>
                    <div>
                      <div style={{ fontSize: "16px", fontWeight: "700", color: s.color }}>{s.name}</div>
                      <div style={{ fontSize: "11px", color: C.faint }}>{s.spend} addressable spend · Priority: {s.priority}</div>
                    </div>
                  </div>
                  <p style={{ fontSize: "13px", lineHeight: "1.7", color: C.muted, margin: "0 0 10px" }}>{s.rationale}</p>
                  <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                    {s.products.map((prod, j) => (
                      <span key={j} style={{ fontSize: "10px", padding: "3px 10px", borderRadius: "20px", background: s.color + "18", color: s.color, fontWeight: "600" }}>{prod}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── WIN / BLOCK ── */}
        {activeSection === "win-block" && (
          <div>
            <SectionHeader title="Win Factors & Blockers" subtitle="What will determine Salesforce's success in UK high-tech" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" }}>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: C.green, fontWeight: "700", marginBottom: "12px", display: "flex", alignItems: "center", gap: "6px" }}>
                  <span>↑</span> Win Factors
                </div>
                {WIN_FACTORS.map((w, i) => (
                  <div key={i} style={{ padding: "14px", background: "#fff", borderLeft: `3px solid ${C.green}`, marginBottom: "10px", borderRadius: "0 4px 4px 0" }}>
                    <div style={{ fontSize: "12px", fontWeight: "700", color: C.ink, marginBottom: "4px" }}>{w.title}</div>
                    <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.5" }}>{w.detail}</div>
                  </div>
                ))}
              </div>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: C.red, fontWeight: "700", marginBottom: "12px", display: "flex", alignItems: "center", gap: "6px" }}>
                  <span>↓</span> Blockers to Mitigate
                </div>
                {BLOCKER_FACTORS.map((b, i) => (
                  <div key={i} style={{ padding: "14px", background: "#fff", borderLeft: `3px solid ${C.red}`, marginBottom: "10px", borderRadius: "0 4px 4px 0" }}>
                    <div style={{ fontSize: "12px", fontWeight: "700", color: C.ink, marginBottom: "4px" }}>{b.title}</div>
                    <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.5" }}>{b.detail}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ── PARTNERS ── */}
        {activeSection === "partners" && (
          <div>
            <SectionHeader title="Partner Synergies" subtitle="Ecosystem leverage for UK high-tech GTM" />
            <div style={{ marginBottom: "16px", padding: "14px 18px", background: C.cream, borderRadius: "6px", fontSize: "13px", color: C.muted, lineHeight: "1.7" }}>
              <strong style={{ color: C.ink }}>The Multiplier Effect:</strong> The Salesforce partner ecosystem will be <strong>6× the size of Salesforce itself</strong> by 2026 — earning $6.19 for every $1 Salesforce earns. In UK high-tech, the partner-led motion is not optional; it is the only model that scales given the post-Brexit talent gap.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {PARTNERS.map((p, i) => (
                <div key={i} style={{ padding: "14px 18px", background: "#fff", border: `1px solid ${C.rule}`, borderRadius: "6px", display: "grid", gridTemplateColumns: "160px auto 80px", gap: "16px", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: "13px", fontWeight: "700", color: C.ink }}>{p.name}</div>
                    <div style={{ fontSize: "10px", color: C.faint, marginTop: "2px" }}>{p.role}</div>
                  </div>
                  <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.5" }}>{p.strength}</div>
                  <div style={{ fontSize: "12px", color: C.amber, textAlign: "right" }}>{p.tier}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: "20px", padding: "16px 20px", background: C.ink, color: C.paper, borderRadius: "6px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: "#888", marginBottom: "8px" }}>Partner Strategy Principles</div>
              <div style={{ fontSize: "13px", lineHeight: "1.8" }}>
                <div style={{ marginBottom: "10px" }}>
                  <strong style={{ color: C.sf }}>Review before assuming.</strong> The market reference list above reflects the broader ecosystem. The correct partner for any given account is determined by who already has relationships there — not by tier alone. An incumbent mid-market SI with board-level access may outperform a global firm with no footprint in that account.
                </div>
                <div style={{ marginBottom: "10px" }}>
                  <strong style={{ color: C.sf }}>Watch for competitive conflicts.</strong> Several major SIs maintain active practices across Salesforce, Microsoft, and ServiceNow simultaneously. Understand each partner's incentive structure and whether they are actively positioning a competing platform in your target accounts.
                </div>
                <div>
                  <strong style={{ color: C.sf }}>Cloud and AI model partnerships are differentiators.</strong> Co-sell motions with cloud hyperscalers unlock access into cloud-native high-tech firms. The ability to offer choice of AI model (including open alternatives) natively within Agentforce is a competitive differentiator that partners can amplify in their own client narratives.
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── ECONOMICS ── */}
        {activeSection === "economics" && (
          <div>
            <SectionHeader title="Economic & Macro Factors" subtitle="Conditions shaping the UK high-tech buying environment" />
            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {ECONOMIC.map((e, i) => {
                const impactColor = e.impact === "Tailwind" ? C.green : e.impact === "Headwind" ? C.red : C.amber;
                return (
                  <div key={i} style={{ padding: "16px 20px", background: "#fff", border: `1px solid ${C.rule}`, borderRadius: "6px", display: "grid", gridTemplateColumns: "200px 80px auto", gap: "16px", alignItems: "start" }}>
                    <div style={{ fontSize: "13px", fontWeight: "700", color: C.ink }}>{e.factor}</div>
                    <div>
                      <span style={{ fontSize: "9px", padding: "2px 8px", borderRadius: "20px", background: impactColor + "20", color: impactColor, fontWeight: "700", letterSpacing: "1px" }}>{e.impact.toUpperCase()}</span>
                    </div>
                    <div style={{ fontSize: "12px", color: C.muted, lineHeight: "1.6" }}>{e.detail}</div>
                  </div>
                );
              })}
            </div>
            <div style={{ marginTop: "20px", padding: "16px", background: C.cream, borderRadius: "6px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: C.faint, marginBottom: "8px" }}>Net Economic Assessment</div>
              <div style={{ fontSize: "13px", color: C.muted, lineHeight: "1.7" }}>
                The structural tailwinds — <strong style={{ color: C.ink }}>government AI commitment, VC funding leadership, regulatory compliance urgency</strong> — significantly outweigh the cyclical headwinds. The NI hike paradoxically <em>strengthens</em> the Agentforce ROI narrative: autonomous agents don't cost employer NI. Frame every deal as "scale without adding headcount cost."
              </div>
            </div>
          </div>
        )}

        {/* ── NEXT STEP ── */}
        {activeSection === "nextStep" && (
          <div>
            <SectionHeader title="Next Steps & Competitor POVs" subtitle="Actions to complete before GTM motions can be executed" />

            {/* Phase 1 */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px", marginBottom: "24px" }}>
              <div style={{ padding: "20px", background: "#fff", border: `1px solid ${C.rule}`, borderRadius: "6px" }}>
                <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: C.sf, marginBottom: "14px" }}>Phase 1 — Immediate</div>
                {[
                  {
                    label: "Prioritise target account list",
                    detail: "Review the full UK high-tech universe across SaaS, Fintech, and Cyber. Tier accounts by revenue potential, AI readiness, and current Salesforce footprint. Identify whitespace vs. expansion opportunities.",
                  },
                  {
                    label: "Audit existing partner landscape",
                    detail: "Map which SIs, consultancies, and technology partners are already active in target accounts. Identify incumbent relationships — these may be allies or blockers — and determine where co-sell motions are viable.",
                  },
                  {
                    label: "Define success criteria per account tier",
                    detail: "Establish what 'winning' looks like at each tier: initial land, expand motion, full-platform adoption. Success metrics should link to business outcomes (cost per agent vs. cost per hire) not just product adoption.",
                  },
                  {
                    label: "Build a Data Cloud-first entry narrative",
                    detail: "Position data unification as the foundation before leading with Agentforce. Accounts with poor data hygiene will not realise AI value — surfacing this early de-risks the deal and positions Salesforce as a strategic partner.",
                  },
                  {
                    label: "Develop ROI framing for the UK cost environment",
                    detail: "Factor in the April 2025 NI increase and talent scarcity when building business cases. Autonomous agents do not carry employer NI — this is a structurally compelling argument unique to the current UK macro context.",
                  },
                ].map((s, i) => (
                  <div key={i} style={{ marginBottom: "12px", paddingBottom: "12px", borderBottom: i < 4 ? `1px solid ${C.rule}` : "none" }}>
                    <div style={{ fontSize: "12px", fontWeight: "700", color: C.ink, marginBottom: "3px", display: "flex", gap: "8px" }}>
                      <span style={{ color: C.sf, flexShrink: 0 }}>{i + 1}.</span>{s.label}
                    </div>
                    <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.6", paddingLeft: "16px" }}>{s.detail}</div>
                  </div>
                ))}
              </div>

              {/* Phase 2 */}
              <div style={{ padding: "20px", background: "#fff", border: `1px solid ${C.rule}`, borderRadius: "6px" }}>
                <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: C.amber, marginBottom: "14px" }}>Phase 2 — 90 Days</div>
                {[
                  {
                    label: "Review and prioritise partner relationships",
                    detail: "Assess which partners bring the strongest access to target accounts — not just delivery capability. Evaluate existing engagement depth, C-suite relationships, and competitive conflicts. Some incumbents may already be committed to competing platforms.",
                  },
                  {
                    label: "Map C-suite relationships per account",
                    detail: "Identify whether existing Salesforce relationships sit at an operational or strategic level. Deals of this nature require CIO, CTO, or CEO sponsorship. Gaps in executive access should be treated as risks to be closed before pitching.",
                  },
                  {
                    label: "Deploy competitor POV battlecards",
                    detail: "For each priority account, establish which competitor is incumbent or shortlisted. The displacement or co-existence strategy differs materially by competitor — generic messaging will not win. See the Agentic AI Competitor Map.",
                  },
                  {
                    label: "Build C-suite messaging by competitive scenario",
                    detail: "Develop exec-level POVs tailored to each displacement context: AI platform consolidation, ITSM expansion into GTM, compliance-led transformation. Each requires a different lead narrative and different executive sponsor.",
                  },
                  {
                    label: "Prepare regulated segment compliance narrative",
                    detail: "Fintech, cyber, and financial services tech accounts face FCA and DORA obligations that are non-negotiable. The compliance narrative must be built before the AI narrative — trust is the door, Agentforce is the room.",
                  },
                ].map((s, i) => (
                  <div key={i} style={{ marginBottom: "12px", paddingBottom: "12px", borderBottom: i < 4 ? `1px solid ${C.rule}` : "none" }}>
                    <div style={{ fontSize: "12px", fontWeight: "700", color: C.ink, marginBottom: "3px", display: "flex", gap: "8px" }}>
                      <span style={{ color: C.amber, flexShrink: 0 }}>{i + 1}.</span>{s.label}
                    </div>
                    <div style={{ fontSize: "11px", color: C.muted, lineHeight: "1.6", paddingLeft: "16px" }}>{s.detail}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Competitor POV tiles */}
            <div style={{ padding: "22px", background: C.ink, color: C.paper, borderRadius: "6px", marginBottom: "20px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "3px", textTransform: "uppercase", color: "#888", marginBottom: "12px" }}>Competitor POV Programme — Coming Next</div>
              <div style={{ fontSize: "12px", color: "#777", marginBottom: "14px", lineHeight: "1.6" }}>
                Each account will have a different competitive context. The battlecard programme below defines the displacement or co-existence angle for each scenario — to be selected based on the incumbent identified in account reviews above.
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: "12px" }}>
                {[
                  { competitor: "vs Microsoft", angle: "Where M365 is the dominant estate — frame Agentforce as the customer-facing AI layer Microsoft cannot natively provide." },
                  { competitor: "vs ServiceNow", angle: "Where ServiceNow owns ITSM — position Agentforce as the GTM and revenue layer, not a replacement." },
                  { competitor: "vs Google Vertex", angle: "Where model quality is the buying narrative — shift the conversation from model to platform and data trust." },
                  { competitor: "vs IBM watsonx", angle: "Where governance is the primary concern — demonstrate comparable compliance posture with faster time-to-value." },
                  { competitor: "vs Oracle", angle: "Where ERP is the system of record — show how Revenue Cloud bridges Oracle data into the agentic GTM layer." },
                ].map((item, i) => (
                  <div key={i} style={{ padding: "12px", background: "#252525", borderRadius: "4px", borderTop: `2px solid ${C.sf}` }}>
                    <div style={{ fontSize: "11px", fontWeight: "700", color: C.sf, marginBottom: "4px" }}>{item.competitor}</div>
                    <div style={{ fontSize: "10px", color: "#888", lineHeight: "1.5", fontStyle: "italic" }}>{item.angle}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ padding: "14px 18px", background: C.cream, borderRadius: "6px", fontSize: "11px", color: C.faint, lineHeight: "1.6" }}>
              <strong style={{ color: C.ink }}>Sources:</strong> Tech Nation Report 2025 · IDC / Salesforce UK Investment Announcement Sept 2025 · Mordor Intelligence UK IT Services 2026 · GlobalData UK ICT 2025 · IMARC UK Tech Market 2025 · MarketsandMarkets AI Agents 2025 · DCMS Cyber Security Sectoral Analysis 2025 · Salesforce Q3 FY2026 Earnings · G2 Agentforce Reviews (846) · Futurum Research 2025 · PwC / Computacenter UK tech market commentary 2025 · UK Government Spending Review 2025 · Tech Nation / Luminarybrands UK Tech Growth 2026 · nickfrates.com Salesforce Ecosystem Analysis
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

function SectionHeader({ title, subtitle }) {
  return (
    <div style={{ marginBottom: "22px", paddingBottom: "12px", borderBottom: `1px solid ${C.rule}` }}>
      <h2 style={{ margin: 0, fontSize: "22px", fontWeight: "700", color: C.ink, letterSpacing: "-0.5px" }}>{title}</h2>
      {subtitle && <div style={{ fontSize: "12px", color: C.faint, marginTop: "4px", fontStyle: "italic" }}>{subtitle}</div>}
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
